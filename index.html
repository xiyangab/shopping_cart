<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <section class="hero">
      <div class="herocontent">
        <h1>Xiyangs clothing Dropshipping Daytrading Shopify store</h1>
        <h2 class="quote">"This is the best clothing store ive ever shopped at!"</h2>
        <h2 class="quote">-Sydney Sweeney</h2>
        <p>MrBeast Approved</p>
      </div>
    </section>

    <div class="filter">
      <h2 id="filter-heading">Filters</h2>
      <button class="all" data-category="all">All</button>
      <button class="button" data-category="shoes">Shoes</button>
      <button class="button" data-category="hoodies">Hoodies</button>
      <button class="button" data-category="pants">Pants</button>
      <button class="button" data-category="graphic-tees">Graphic-Tees</button>
      <button class="button" data-category="socks">Socks</button>
    </div>

    <div id="class-container" class="container"></div>

    <div class="card-title">
      <h2 class="title">Your Cart:</h2>
    </div>
    <div class="cart-container"></div>

    <form action="submit">
      <label for="coupon">Enter Coupon Code</label>
      <input type="text" name="coupon" id="coupon" />
      <button id="coupon-btn" type="submit">Enter Code</button>
    </form>

    <div class="show-cart">
      <img class="cartimage" src="images/shoppingcart.png" alt="shoppingcart" />
      <p class="amount">Items in Cart:</p>
    </div>

    <div class="contact">
      <h2>get in contact @xiyangisveryhandsome@gmail.com</h2>
    </div>

    <script src="app.js"></script>
  </body>
</html>
